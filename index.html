<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <!-- 設定響應式視窗 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 載入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Noto+Serif+HK:wght@200..900&display=swap" rel="stylesheet">

  <!-- 載入 p5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

  <!-- 設定網頁樣式 -->
  <style>
    /* 讓網頁填滿整個瀏覽器視窗 */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f7ff;
    }

    /* 讓畫布以區塊方式顯示 */
    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <!-- 載入 sketch.js -->
  <script src="sketch.js"></script>
</body>
</html>
